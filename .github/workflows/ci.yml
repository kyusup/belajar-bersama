name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: belajar_bersama
          POSTGRES_USER: belajar
          POSTGRES_PASSWORD: belajar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belajar -d belajar_bersama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify
        working-directory: apps/api
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/belajar_bersama
          POSTGRES_USER: belajar
          POSTGRES_PASSWORD: belajar
        run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter web lint
      - run: pnpm --filter web format:check
      - run: pnpm --filter web test
      - run: pnpm --filter web build
