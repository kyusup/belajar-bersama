quarkus.application.name=belajar-bersama-api
bb.application.version=0.1.0

quarkus.http.port=${API_PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-correlation-id,x-request-id
quarkus.http.cors.exposed-headers=x-correlation-id
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:belajar}
quarkus.datasource.password=${POSTGRES_PASSWORD:belajar}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/belajar_bersama}

quarkus.datasource.devservices.enabled=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.smallrye-openapi.info-title=Belajar Bersama API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Public REST API. Anonymous health/status and competencies remain public.

bb.auth.dev-login.enabled=${AUTH_DEV_LOGIN:false}
bb.auth.bootstrap-admin-subjects=${AUTH_BOOTSTRAP_ADMINS:unset}
bb.auth.session-ttl-hours=168
bb.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
bb.auth.api-public-url=${API_URL:http://localhost:8080}
bb.auth.app-url=${APPLICATION_URL:http://localhost:3000}
bb.auth.google.client-id=${GOOGLE_CLIENT_ID:unset}
bb.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:unset}
bb.auth.apple.client-id=${APPLE_CLIENT_ID:unset}
bb.auth.apple.team-id=${APPLE_TEAM_ID:unset}
bb.auth.apple.key-id=${APPLE_KEY_ID:unset}
bb.auth.apple.private-key=${APPLE_PRIVATE_KEY:unset}

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] correlationId=%X{correlationId} - %s%e%n

bb.storage.provider=${STORAGE_PROVIDER:memory}
bb.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
bb.s3.region=${S3_REGION:us-east-1}
bb.s3.bucket=${S3_BUCKET:belajar-bersama}
bb.s3.access-key=${S3_ACCESS_KEY:minioadmin}
bb.s3.secret-key=${S3_SECRET_KEY:minioadmin}

%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.username=${POSTGRES_USER:belajar}
%test.quarkus.datasource.password=${POSTGRES_PASSWORD:belajar}
%test.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/belajar_bersama}
%test.bb.storage.provider=memory
%test.quarkus.flyway.migrate-at-start=true
%test.bb.auth.dev-login.enabled=true
%test.bb.auth.bootstrap-admin-subjects=GOOGLE:admin-1
%test.bb.auth.cookie-secure=false
%test.bb.rate-limit.enabled=true
%test.bb.rate-limit.auth-per-minute=10000
%test.bb.rate-limit.write-per-minute=10000
%test.bb.rate-limit.report-per-minute=10000
%test.bb.rate-limit.search-per-minute=10000
%test.bb.rate-limit.public-per-minute=10000

bb.rate-limit.enabled=true
bb.rate-limit.trust-forwarded-for=false
bb.rate-limit.auth-per-minute=20
bb.rate-limit.write-per-minute=60
bb.rate-limit.report-per-minute=10
bb.rate-limit.search-per-minute=40
bb.rate-limit.public-per-minute=120

