name: belajar-bersama

services:
  postgres:
    image: postgres:16-alpine
    container_name: belajar-bersama-postgres
    environment:
      POSTGRES_DB: belajar_bersama
      POSTGRES_USER: belajar
      POSTGRES_PASSWORD: belajar
    ports:
      - "55432:5432"
    volumes:
      - belajar_bersama_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belajar -d belajar_bersama"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: belajar-bersama-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - belajar_bersama_minio:/data

volumes:
  belajar_bersama_pg:
  belajar_bersama_minio:
